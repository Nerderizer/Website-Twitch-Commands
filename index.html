<div class="container">

    <div class="header">
        <h1>🎮 Stream Commands</h1>

        <p>
            Available chat commands for the UserID10T Twitch channel.
        </p>

        <div class="last-updated">
            Last updated:
            <span id="lastUpdated">Loading...</span>
        </div>
    </div>

    <div class="search-wrapper">
        <input
            id="searchBar"
            class="search-box"
            type="text"
            placeholder="🔍 Search commands..."
            onkeyup="filterTable()">
    </div>

    <div class="stats">

        <div class="stat">
            <div id="totalCommands" class="stat-number">0</div>
            <div class="stat-label">Commands</div>
        </div>

        <div class="stat">
            <div id="totalGroups" class="stat-number">0</div>
            <div class="stat-label">Categories</div>
        </div>

        <div class="stat">
            <div id="publicCommands" class="stat-number">0</div>
            <div class="stat-label">Public</div>
        </div>

    </div>

    <div class="card">

        <table id="commandTable">

            <thead>

                <tr>

                    <th width="30%">Command</th>

                    <th width="55%">Description</th>

                    <th width="15%" class="hide-mobile">
                        Access
                    </th>

                </tr>

            </thead>

            <tbody id="tableBody">

                <tr>

                    <td colspan="3"
                        style="padding:50px;text-align:center;">

                        Loading commands...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <div class="footer">

        Commands automatically generated from Streamer.bot.

    </div>

</div>
