<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>UserID10T Commands</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <header class="hero">

        <h1>🎮 UserID10T</h1>

        <p class="subtitle">
            Twitch Chat Commands
        </p>

        <div class="updated">
            Updated
            <span id="lastUpdated">Loading...</span>
        </div>

    </header>


    <section class="search-area">

        <input
            id="searchBar"
            type="text"
            placeholder="🔍 Search commands..."
            oninput="filterCommands()">

    </section>


    <section id="tabBar" class="tabs">

        <!-- Generated automatically -->

    </section>


    <main id="commandContainer">

        <div class="loading">

            Loading commands...

        </div>

    </main>


</div>



<div id="toast" class="toast">

Copied!

</div>



<script>

let allCommands=[];

let currentGroup="All";



function normalize(value){

    return (value||"").toLowerCase();

}



function permissionClass(permission){

    permission=normalize(permission);

    if(permission.includes("broadcaster")) return "broadcaster";

    if(permission.includes("mod")) return "mod";

    if(permission.includes("vip")) return "vip";

    return "everyone";

}



function escapeHtml(text){

    return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#39;");

}



function createTabs(){

    const tabBar=document.getElementById("tabBar");



    const groups=[

        "All",

        ...new Set(

            allCommands

            .map(c=>c.Group||"Ungrouped")

            .sort()

        )

    ];



    tabBar.innerHTML="";



    groups.forEach(group=>{

        const button=document.createElement("button");



        button.className="tab";



        if(group===currentGroup)

            button.classList.add("active");



        button.textContent=group;



        button.onclick=()=>{

            currentGroup=group;

            createTabs();

            filterCommands();

        };



        tabBar.appendChild(button);

    });

}



function render(commands){

    const container=document.getElementById("commandContainer");



    if(commands.length===0){

        container.innerHTML=`

            <div class="empty">

                No commands found.

            </div>

        `;

        return;

    }



    container.innerHTML=commands.map(cmd=>`

<div class="command-card">

    <div class="command-top">

        <span class="command-pill">

            ${escapeHtml(cmd.Trigger)}

        </span>

        <span class="badge ${permissionClass(cmd.Permissions)}">

            ${escapeHtml(cmd.Permissions)}

        </span>

    </div>



    <div class="description">

        ${escapeHtml(cmd.Description)}

    </div>

</div>

`).join("");

}



function filterCommands(){

    const query=normalize(

        document.getElementById("searchBar").value

    );



    let list=[...allCommands];



    if(currentGroup!=="All"){

        list=list.filter(

            c=>(c.Group||"Ungrouped")===currentGroup

        );

    }



    if(query){

        list=list.filter(c=>{

            return [

                c.Trigger,

                c.Description,

                c.Group,

                c.Permissions

            ]

            .join(" ")

            .toLowerCase()

            .includes(query);

        });

    }



    render(list);

}



async function loadCommands(){

    const response=await fetch(

        "commands.json",

        {

            cache:"no-store"

        }

    );



    allCommands=await response.json();



    createTabs();

    render(allCommands);



    document.getElementById(

        "lastUpdated"

    ).textContent=

        new Date().toLocaleString();

}



document.addEventListener(

    "DOMContentLoaded",

    loadCommands

);

</script>

</body>

</html>
