<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>UserID10T Commands</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <header class="hero">

        <h1>🎮 UserID10T</h1>

        <p class="subtitle">
            Twitch Chat Commands
        </p>

        <div class="updated">
            Updated
            <span id="lastUpdated">Loading...</span>
        </div>

    </header>


    <section class="search-area">

        <input
            id="searchBar"
            type="text"
            placeholder="🔍 Search commands..."
            oninput="filterCommands()">

    </section>


    <section id="tabBar" class="tabs">

        <!-- Generated automatically -->

    </section>


    <main id="commandContainer">

        <div class="loading">

            Loading commands...

        </div>

    </main>


</div>



<div id="toast" class="toast">

Copied!

</div>



<script>

let allCommands = [];
let currentGroup = "All";

const GROUP_ICONS = {
    "All":"🏠",
    "Community":"💬",
    "General":"💬",
    "Games":"🎮",
    "Game":"🎮",
    "Stream":"📺",
    "Music":"🎵",
    "Moderator":"👑",
    "Moderation":"👑",
    "Utility":"🛠",
    "Utilities":"🛠",
    "Admin":"⚙️",
    "Developer":"💻"
};

function normalize(value){
    return (value || "").toLowerCase();
}

function escapeHtml(text){
    return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
}

function permissionClass(permission){

    permission = normalize(permission);

    if(permission.includes("broadcaster"))
        return "broadcaster";

    if(permission.includes("mod"))
        return "mod";

    if(permission.includes("vip"))
        return "vip";

    return "everyone";
}

function permissionLabel(permission){

    if(!permission)
        return "Everyone";

    return permission;
}

function getGroups(){

    return [...new Set(

        allCommands.map(c => c.Group || "General")

    )].sort();

}

function createTabs(){

    const tabBar = document.getElementById("tabBar");

    tabBar.innerHTML = "";

    const groups = ["All", ...getGroups()];

    groups.forEach(group=>{

        const count = group==="All"

            ? allCommands.length

            : allCommands.filter(c=>(c.Group||"General")===group).length;

        const button=document.createElement("button");

        button.className="tab";

        if(group===currentGroup)
            button.classList.add("active");

        const icon = GROUP_ICONS[group] ?? "📁";

        button.innerHTML=`
            ${icon}
            <span>${group}</span>
            <span class="tab-count">${count}</span>
        `;

        button.onclick=()=>{

            currentGroup=group;

            createTabs();

            render();

        };

        tabBar.appendChild(button);

    });

}

function filteredCommands(){

    const search = normalize(
        document.getElementById("searchBar").value
    );

    return allCommands.filter(cmd=>{

        if(currentGroup!=="All"){

            if((cmd.Group||"General")!==currentGroup)
                return false;

        }

        if(search==="")
            return true;

        return [

            cmd.Trigger,

            cmd.Description,

            cmd.Group,

            cmd.Permissions

        ].join(" ")

        .toLowerCase()

        .includes(search);

    });

}

function render(){

    const container=document.getElementById("commandContainer");

    const commands=filteredCommands();

    if(commands.length===0){

        container.innerHTML=`

            <div class="empty">

                <h2>No commands found</h2>

                <p>Try another search.</p>

            </div>

        `;

        return;

    }

    container.innerHTML=commands.map(cmd=>`

<div class="command-card"
     onclick="copyCommand('${escapeHtml(cmd.Trigger)}')">

    <div class="command-top">

        <span class="command-pill">

            ${escapeHtml(cmd.Trigger)}

        </span>

        <span class="badge ${permissionClass(cmd.Permissions)}">

            ${permissionLabel(cmd.Permissions)}

        </span>

    </div>

    <div class="description">

        ${escapeHtml(cmd.Description)}

    </div>

    <div class="card-footer">

        <span>

            ${GROUP_ICONS[cmd.Group] ?? "📁"}

            ${escapeHtml(cmd.Group)}

        </span>

        <span>

            📋 Click to copy

        </span>

    </div>

</div>

`).join("");

}

function filterCommands(){

    render();

}

async function copyCommand(command){

    try{

        await navigator.clipboard.writeText(command);

        const toast=document.getElementById("toast");

        toast.textContent=`Copied ${command}`;

        toast.classList.add("show");

        setTimeout(()=>{

            toast.classList.remove("show");

        },1800);

    }
    catch{

        alert(command);

    }

}

async function loadCommands(){

    try{

        const response=await fetch(

            "commands.json",

            {

                cache:"no-store"

            }

        );

        allCommands=await response.json();

        document.getElementById("lastUpdated").textContent=

            new Date().toLocaleString();

        createTabs();

        render();

    }
    catch(e){

        document.getElementById("commandContainer").innerHTML=`

        <div class="empty">

            Failed to load commands.

        </div>

        `;

        console.error(e);

    }

}

document.addEventListener(

    "DOMContentLoaded",

    loadCommands

);

</script>

</body>

</html>
